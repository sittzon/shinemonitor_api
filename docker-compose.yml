version: '3.7'

services:
  api:
    image: shinemonitorapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    container_name: shinemonitor_api
    volumes:
      - ./token:/app/token
      - ./src/config.py:/app/src/config.py:ro
      - ./data:/app/data